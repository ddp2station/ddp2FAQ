const DATA={"ko": {"station": "현재 역은 동대문역사문화공원 2호선입니다", "titles": ["1. 카드오류", "2. 출구를 잘못 나왔어요.", "3. 4, 5호선으로 환승하고 싶어요", "4. 기타 문의"], "intro": "1) 나가는 게이트와 들어오는 게이트가 서로 다릅니다. 알맞은 게이트(초록색 화살표)를 이용하세요.\n2) 카드를 다시 한 번 찍어주세요. 나오는 메시지를 확인하시고, 해당되는 에러코드를 선택하세요.\n*추가요금 발생하지 않음.", "codes": [{"label": "E-03(집표가 안 된 카드)", "body": "집표가 안 된 카드(하차 처리 안 된 카드).\n게이트 안쪽 화장실 맞은편에 위치한 고객안전실(Information)에 문의하세요."}, {"label": "E-04(개표가 안 된 카드)", "body": "개표가 안 된 카드(승차 처리 안 된 카드).\n게이트 안쪽 화장실 맞은편에 위치한 고객안전실(Information)에 문의하세요."}, {"label": "E-05(이용시간 초과)", "body": "이용시간 초과.\n게이트 안쪽 화장실 맞은편에 위치한 고객안전실(Information)에 문의하세요."}, {"label": "E-07(카드 유효기간 경과)", "body": "카드 유효기간 경과.\n게이트 안쪽 화장실 맞은편에 위치한 고객안전실(Information)에 문의하세요."}, {"label": "E-14(잔액 부족)", "body": "잔액 부족. 우측 정산기(발매기)를 이용하여 충전 후 카드를 다시 찍고 나가세요. 동전만 이용 가능합니다."}, {"label": "E-27(정기권 기간만료)", "body": "정기권 기간만료.\n게이트 안쪽 화장실 맞은편에 위치한 고객안전실(Information)에 문의하세요."}, {"label": "E-33(이미 개표된 카드)", "body": "이미 개표된 카드(이미 승차 처리된 카드).\n비상게이트(휠체어게이트)를 지나가세요(소리가 나도 무시하세요)"}, {"label": "E-44(이미 집표된 카드)", "body": "이미 집표된 카드(이미 하차 처리된 카드).\n비상게이트(휠체어게이트)를 지나가세요(소리가 나도 무시하세요)"}], "other": ["1) 1회권 또는 무임권:\n헬프콜 버튼을 누른 뒤 반대편 출구로 건너가고 싶다고 말씀하세요.\n2) 티머니 카드 또는 기후동행패스:\n카드를 찍고 나가시고, 반대편 게이트에서 카드를 찍고 들어가세요.\n(추가 요금 없음, 환승 1회만 차감)", "가 게이트(1번 출구) 근처에서 하늘색(4호선), 보라색(5호선) 라인을 따라 쭉 걸어가세요.\n\n환승이 아닌 2호선만 이용하고자 하는 경우에는, 카드를 찍고 게이트 안쪽으로 들어간 뒤 계단을 내려가세요.", "헬프콜 버튼을 누르세요.\n\n또는\n\n게이트 안쪽 화장실 맞은편에 위치한 고객안전실(Information)에 문의하세요."]}, "en": {"station": "You are now at Dongdaemun History & Culture Park (DDP), Line 2", "titles": ["1. Card Errors", "2. I went through the wrong gate. (I want to use the exit on the other side.)", "3. How to transfer to Line 4 and 5", "4. Other Inquiries"], "intro": "1) There are two separate gates for entry and exit. Please use the correct gate (green arrow).\n2) Tap your card again (No extra fare). Check the message when tapping your card and select the corresponding error code.", "codes": [{"label": "E-03(Not processed for exit)", "body": "The ticket has not been processed for exit.\nPlease visit the station office (Information) located across from the restroom inside the ticket gates."}, {"label": "E-04(Not processed for entry)", "body": "The ticket has not been processed for entry.\nPlease visit the station office (Information) located across from the restroom inside the ticket gates."}, {"label": "E-05(Time exceeded)", "body": "Time exceeded.\nPlease visit the station office (Information) located across from the restroom inside the ticket gates."}, {"label": "E-07(Card expired)", "body": "Card expired.\nPlease visit the station office (Information) located across from the restroom inside the ticket gates."}, {"label": "E-14(Insufficient balance)", "body": "Insufficient balance (Not enough money).\nUse the ticket machine (on your right) to recharge and tap your card again to exit. Only coins are accepted."}, {"label": "E-27(Commuter pass expired)", "body": "Commuter pass expired.\nPlease visit the station office (Information) located across from the restroom inside the ticket gates."}, {"label": "E-33(Already processed for entry)", "body": "Already processed for entry (Card has already been tagged).\nPass through the emergency gate (Ignore the beep sound)."}, {"label": "E-44(Already processed for exit)", "body": "Already processed for exit (Card has already been tagged).\nPass through the emergency gate (Ignore the beep sound)."}], "other": ["1) Single-journey ticket: Do not tap your card. Press the help call button and tell us that you want to use the exit on the opposite side.\n2) T-money (Transportation Card) or Climate Card: Tap to exit, then tap again at the opposite gate to enter.\n(No extra fare, only one transfer counted.)", "Near Gate A (Exit 1), follow the light blue line for Line 4 or the purple line for Line 5.\nIf you only want to use Line 2 without transferring, tap your card to enter through the gate, then go down the stairs.", "Press the help call button.\nOr\nPlease visit the station office (Information) located across from the restroom inside the ticket gates."]}, "zh": {"station": "您现在位于 2号线 东大门历史文化公园站。", "titles": ["1. 卡片错误", "2. 我走错闸机了。（我想从另一侧的出口出去。）", "3. 如何换乘4号线和5号线", "4. 其他咨询"], "intro": "1) 进站和出站闸机是分开的。请使用正确的闸机（绿色箭头）。\n2) 请再次刷卡（无额外费用）。 刷卡时请确认显示的提示信息，并选择相应的错误代码。", "codes": [{"label": "E-03(上次出站未刷卡)", "body": "上次出站未刷卡。\n请前往闸机内侧、洗手间对面的车站办公室（问讯处）咨询。"}, {"label": "E-04(进站时未刷卡)", "body": "进站时未刷卡。\n请前往闸机内侧、洗手间对面的车站办公室（问讯处）咨询。"}, {"label": "E-05(超过使用时间)", "body": "超过使用时间。\n请前往闸机内侧、洗手间对面的车站办公室（问讯处）咨询。"}, {"label": "E-07(卡片已过期)", "body": "卡片已过期。\n请前往闸机内侧、洗手间对面的车站办公室（问讯处）咨询。"}, {"label": "E-14(余额不足)", "body": "余额不足（金额不足）。\n请使用右侧的自助售票机为卡片充值，然后再次刷卡出站。仅接受硬币。"}, {"label": "E-27(定期票已过期)", "body": "定期票已过期。\n请前往闸机内侧、洗手间对面的车站办公室（问讯处）咨询。"}, {"label": "E-33(已处理过进站)", "body": "已处理过进站（卡片已被标记）。\n请通过应急门（轮椅专用宽通道），请忽略报警声。"}, {"label": "E-44(已处理过出站)", "body": "已处理过出站（卡片已被标记）。\n请通过应急门（轮椅专用宽通道），请忽略报警声。"}], "other": ["1) 单程票： 请勿刷卡。请按求助按钮，告知工作人员您想前往另一侧的出口。\n2) T-money卡或气候同行卡： 刷卡出站后，从对面闸机再次刷卡进站。\n（不产生额外费用，仅计为一次换乘。）", "请在A闸机（1号出口）附近，沿浅蓝色指引线前往4号线，或沿紫色指引线前往5号线。\n如果您不需要换乘，只想乘坐2号线，请刷卡通过闸机进站，然后下楼梯。", "请按求助按钮。\n或者\n请前往闸机内侧、洗手间对面的车站办公室（问讯处）咨询。"]}, "ja": {"station": "現在地は 2号線 東大門歴史文化公園駅（トンデムンヨクサムンファゴンウォン駅）です。", "titles": ["1. カードエラー", "2. 間違ったゲートを通ってしまいました。（反対側の出口を利用したいです。）", "3. 4号線・5号線への乗り換え方法", "4. その他のお問い合わせ"], "intro": "1) 入場用と退場用のゲートは分かれています。正しいゲート（緑の矢印）を使用してください。\n2) もう一度タッチしてください（追加料金なし）。 カードをタッチした際のメッセージを確認し、対応するエラーコードを選択してください。", "codes": [{"label": "E-03(下車処理未完了)", "body": "下車処理がされていません。\n改札内のトイレの向かいにある駅務室（Information）にお越しください。"}, {"label": "E-04(乗車処理未完了)", "body": "乗車処理がされていません。\n改札内のトイレの向かいにある駅務室（Information）にお越しください。"}, {"label": "E-05(利用時間超過)", "body": "時間超過です。\n改札内のトイレの向かいにある駅務室（Information）にお越しください。"}, {"label": "E-07(有効期限切れ)", "body": "カードの期限切れです。\n改札内のトイレの向かいにある駅務室（Information）にお越しください。"}, {"label": "E-14(残高不足)", "body": "残高不足（お金が足りません）。\n右側の券売機でチャージした後、もう一度カードをタッチして出場してください。硬貨のみ使用できます。"}, {"label": "E-27(定期券期限切れ)", "body": "定期券の期限切れです。\n改札内のトイレの向かいにある駅務室（Information）にお越しください。"}, {"label": "E-33(既に乗車処理済み)", "body": "既に乗車処理済みです（既にタッチされています）。\n非常ゲート（車椅子用の幅広ゲート）を通ってください（警告音が鳴っても無視してください）。"}, {"label": "E-44(既に下車処理済み)", "body": "既に下車処理済みです（既にタッチされています）。\n非常ゲート（車椅子用の幅広ゲート）を通ってください（警告音が鳴っても無視してください）。"}], "other": ["1) 1回券の場合： カードをタッチしないでください。ヘルプコールボタンを押し、反対側の出口へ行きたい旨を伝えてください。\n2) T-moneyまたは気候同行カード： 一度タッチして出場し、反対側のゲートから再度タッチして入場してください。\n（追加料金なし、乗り換え1回としてカウントされます。）", "Aゲート（1番出口）付近から、4号線は水色の案内ライン、5号線は紫色の案内ラインに沿って進んでください。\n乗り換えずに2号線のみをご利用の場合は、カードをタッチして改札内に入り、階段を下りてください。", "ヘルプコールボタンを押してください。\nまたは\n改札内のトイレの向かいにある駅務室（Information）にお越しください。"]}, "es": {"station": "Usted está ahora en Dongdaemun History & Culture Park (DDP), Línea 2", "titles": ["1. Errores de tarjeta", "2. Pasé por la puerta equivocada. (Quiero usar la salida del otro lado.)", "3. Cómo transbordar a las Líneas 4 y 5", "4. Otras consultas"], "intro": "1) Hay dos puertas separadas para la entrada y la salida. Use la puerta correcta (flecha verde).\n2) Pase su tarjeta de nuevo (Sin costo adicional). Verifique el mensaje al tocar su tarjeta y seleccione el código de error correspondiente.", "codes": [{"label": "E-03(Sin registro de salida)", "body": "El boleto no tiene registro de salida.\nVisite la oficina de la estación (Información) ubicada frente al baño, dentro de las puertas de acceso."}, {"label": "E-04(Sin registro de entrada)", "body": "El boleto no tiene registro de entrada.\nVisite la oficina de la estación (Información) ubicada frente al baño, dentro de las puertas de acceso."}, {"label": "E-05(Tiempo excedido)", "body": "Tiempo excedido.\nVisite la oficina de la estación (Información) ubicada frente al baño, dentro de las puertas de acceso."}, {"label": "E-07(Tarjeta expirada)", "body": "Tarjeta expirada.\nVisite la oficina de la estación (Información) ubicada frente al baño, dentro de las puertas de acceso."}, {"label": "E-14(Saldo insuficiente)", "body": "Saldo insuficiente (No hay suficiente dinero).\nUtilice la máquina expendedora de billetes a su derecha para recargar su tarjeta y vuelva a pasarla para salir. Solo se aceptan monedas."}, {"label": "E-27(Pase de transporte vencido)", "body": "Pase de transporte vencido.\nVisite la oficina de la estación (Información) ubicada frente al baño, dentro de las puertas de acceso."}, {"label": "E-33(Ya registrado entrada)", "body": "Entrada ya procesada (La tarjeta ya ha sido registrada).\nPase por la puerta de emergencia (puerta ancha para sillas de ruedas). Ignore el sonido de alarma."}, {"label": "E-44(Ya registrado salida)", "body": "Salida ya procesada (La tarjeta ya ha sido registrada).\nPase por la puerta de emergencia (puerta ancha para sillas de ruedas). Ignore el sonido de alarma."}], "other": ["1) Boleto de un solo viaje: No toque la tarjeta. Presione el botón de ayuda y diga que quiere ir a la salida del lado opuesto.\n2) Tarjeta T-money o Climate Card: Pase la tarjeta para salir, luego pase de nuevo desde la puerta opuesta para entrar.\n(Sin cargo adicional, solo se cuenta un transbordo).", "Cerca de la puerta A (salida 1), siga la línea de guía azul claro para llegar a la línea 4 o la línea morada para llegar a la línea 5.\nSi solo desea utilizar la línea 2 sin hacer transbordo, pase su tarjeta para entrar por la puerta de acceso y luego baje las escaleras.", "Presione el botón de ayuda.\nO\nVisite la oficina de la estación (Información) ubicada frente al baño, dentro de las puertas de acceso."]}};const backText={ko:'뒤로가기',en:'Back',zh:'返回',ja:'戻る',es:'Volver'};let current=null;const langBox=document.getElementById('language'),faqBox=document.getElementById('faq'),list=document.getElementById('faq-list'),back=document.getElementById('back');function el(tag,cls,text){let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}function addFormattedText(container,source,highlightPhrase=''){
  function addLine(target,text){
    const node=el('div','text-line');
    const pos=highlightPhrase?text.indexOf(highlightPhrase):-1;
    if(pos>=0){
      node.appendChild(document.createTextNode(text.slice(0,pos)));
      node.appendChild(el('strong','',highlightPhrase));
      node.appendChild(document.createTextNode(text.slice(pos+highlightPhrase.length)));
    }else node.textContent=text;
    target.appendChild(node);
  }

  // Keep each numbered paragraph and its following lines in the same hanging-indent column.
  let content=null;
  source.split('\n').forEach(line=>{
    const match=line.match(/^(\d+\))\s*(.*)$/);
    if(match){
      const row=el('div','numbered-line');
      row.appendChild(el('span','numbered-marker',match[1]));
      content=el('div','numbered-content');
      addLine(content,match[2]);
      row.appendChild(content);
      container.appendChild(row);
    }else if(content && line.trim()!==''){
      addLine(content,line);
    }else{
      content=null;
      addLine(container,line);
    }
  });
}
function selectLanguage(l){current=l;document.documentElement.lang=l;const d=DATA[l];langBox.classList.add('hidden');faqBox.classList.remove('hidden');back.classList.remove('hidden');back.textContent=backText[l];document.getElementById('station-name').textContent=d.station;list.replaceChildren();d.titles.forEach((title,i)=>{const wrapper=el('div','faq-item');const btn=el('button','faq-title',title);btn.setAttribute('aria-expanded','false');const body=el('div','faq-body hidden');if(i===0){const intro=el('div','intro');addFormattedText(intro,d.intro);body.appendChild(intro);d.codes.forEach((code)=>{const cb=el('button','code-button',code.label);cb.setAttribute('aria-expanded','false');const answer=el('div','code-body hidden',code.body);cb.addEventListener('click',()=>{const opening=answer.classList.contains('hidden');body.querySelectorAll('.code-body').forEach(e=>e.classList.add('hidden'));body.querySelectorAll('.code-button').forEach(e=>e.setAttribute('aria-expanded','false'));if(opening){answer.classList.remove('hidden');cb.setAttribute('aria-expanded','true')}});body.append(cb,answer)})}else{const simple=el('div','simple-body');addFormattedText(simple,d.other[i-1],i===1?({en:'Do not tap your card.',zh:'请勿刷卡。',ja:'カードをタッチしないでください。',es:'No toque la tarjeta.'}[l]||''):'');body.appendChild(simple)}btn.addEventListener('click',()=>{const opening=body.classList.contains('hidden');list.querySelectorAll('.faq-body').forEach(e=>e.classList.add('hidden'));list.querySelectorAll('.faq-title').forEach(e=>e.setAttribute('aria-expanded','false'));if(opening){body.classList.remove('hidden');btn.setAttribute('aria-expanded','true')}});wrapper.append(btn,body);list.appendChild(wrapper)});window.scrollTo(0,0)}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>selectLanguage(b.dataset.lang)));back.addEventListener('click',()=>{current=null;faqBox.classList.add('hidden');back.classList.add('hidden');langBox.classList.remove('hidden');window.scrollTo(0,0)});
</script></body></html>
